name: Sync IBKR portfolio

# Pull positions into Supabase on a schedule. UI reads Supabase, never IBKR directly.
# Times are UTC. US market 09:30–16:00 ET ≈ 13:30–20:00 UTC (ignores DST drift by ±1h, harmless).
on:
  schedule:
    - cron: '*/10 13-20 * * 1-5' # every 10 min, weekdays, market hours-ish
  workflow_dispatch: {} # manual run button

concurrency:
  group: sync-ibkr
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ibkr
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          IBKR_CONSUMER_KEY: ${{ secrets.IBKR_CONSUMER_KEY }}
          IBKR_ACCESS_TOKEN: ${{ secrets.IBKR_ACCESS_TOKEN }}
          IBKR_ACCESS_TOKEN_SECRET: ${{ secrets.IBKR_ACCESS_TOKEN_SECRET }}
          IBKR_ENCRYPTION_KEY: ${{ secrets.IBKR_ENCRYPTION_KEY }}
          IBKR_SIGNATURE_KEY: ${{ secrets.IBKR_SIGNATURE_KEY }}
          IBKR_DH_PRIME: ${{ secrets.IBKR_DH_PRIME }}
          IBKR_ACCOUNT_ID: ${{ secrets.IBKR_ACCOUNT_ID }}
          IBKR_REALM: ${{ secrets.IBKR_REALM }}
